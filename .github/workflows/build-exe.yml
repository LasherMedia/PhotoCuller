name: Build Windows EXE
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow opencv-python-headless numpy pillow-heif pyinstaller
      - run: pyinstaller --onefile --windowed --name PhotoCuller photo_culler.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoCuller-windows
          path: dist/PhotoCuller.exe
